name: Linux hotspot relay package

on:
  push:
    branches: [codex/hotspot-relay-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotspot-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: stable
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    uses: ./.github/workflows/hotspot-bridge.yml

  build-linux-x86_64:
    name: Ubuntu x86_64 DEB
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false

      - name: Restore pinned private common source
        run: |
          mkdir -p libs/hbb_common
          tar -xzf .github/build-inputs/hbb-common-229b9045.tar.gz -C libs/hbb_common

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> "$GITHUB_ENV"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build Linux application
        uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        with:
          arch: x86_64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
              build-essential clang cmake curl gcc git g++ \
              libayatana-appindicator3-dev libasound2-dev \
              libclang-10-dev libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev libgtk-3-dev \
              libpulse-dev libssl-dev libva-dev libxcb-randr0-dev \
              libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
              libxfixes-dev llvm-10-dev nasm ninja-build pkg-config \
              python3 rpm tree unzip wget xz-utils
            apt-get remove -y libopus-dev || true
          run: |
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz \
              "https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
            tar -zxf rust.tar.gz
            rm rust.tar.gz
            cd "rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu"
            ./install.sh
            cd /opt
            rm -rf "/opt/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu"
            wget "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            tar -xf "flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz"
            export PATH="/opt/flutter/bin:$PATH"
            flutter doctor -v
            pushd /opt/flutter
            git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            popd
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib \
              --features hwcodec,flutter,unix-file-copy-paste \
              --release
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --skip-cargo
            for name in rustdesk*??.deb; do
              mv "$name" "${name%%.deb}-x86_64.deb"
            done

      - name: Verify DEB contents
        shell: bash
        run: |
          DEB=$(find . -maxdepth 1 -name 'rustdesk*-x86_64.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E 'usr/share/rustdesk/(rustdesk|lib/librustdesk.so)$'
          sha256sum "$DEB" > SHA256SUMS-linux.txt

      - name: Upload Linux DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-hotspot-relay-linux-x86_64
          path: |
            rustdesk*-x86_64.deb
            SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
